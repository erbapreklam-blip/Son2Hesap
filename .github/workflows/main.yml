name: Windows Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ReklamHesap.csproj

      - name: Publish Windows
        run: dotnet publish ReklamHesap.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Create ZIP
        run: Compress-Archive -Path publish\* -DestinationPath ReklamHesap-Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReklamHesap-Windows
          path: ReklamHesap-Windows.zip
